<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a171a">
<title>Sea Breeze Hotel — Client Preview</title>
<style>
html,body{height:100%;margin:0;background:#0a171a;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.load{height:100%;display:grid;place-items:center;text-align:center;padding:24px}
.ring{width:42px;height:42px;border:3px solid rgba(255,255,255,.2);border-top-color:#ef7e37;border-radius:50%;margin:0 auto 18px;animation:s .8s linear infinite}
small{opacity:.7;letter-spacing:.08em}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="load"><div><div class="ring"></div><div>Opening Sea Breeze Hotel</div><small>CLIENT PREVIEW</small></div></div>
<script>
(async()=>{try{
 const a=[];
 for(let i=1;i<=31;i++){
  const p='parts/p'+String(i).padStart(2,'0')+'.txt';
  const r=await fetch(p,{cache:'force-cache'});
  if(!r.ok) throw new Error('Missing '+p);
  a.push(await r.text());
 }
 document.open();
 document.write(a.join('\n'));
 document.close();
}catch(e){
 document.body.innerHTML='<div class="load"><div><h2>Preview could not load</h2><p>Please refresh this page.</p></div></div>';
 console.error(e);
}})();
</script>
</body>
</html>
